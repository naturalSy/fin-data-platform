services:
  oracle:
    image: gvenzl/oracle-free:23-faststart
    container_name: fdp-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
    volumes:
      - oradata:/opt/oracle/oradata
      - ./diag:/opt/oracle/diag
      - ./initdb:/container-entrypoint-initdb.d
    shm_size: 2gb
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fdp-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    mem_limit: 512m
    restart: unless-stopped

volumes:
  oradata:
